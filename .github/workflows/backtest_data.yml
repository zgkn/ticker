name: Backtest data

# Downloads daily history for the whole backtest universe (backtest/universe.txt) in
# one run and commits it under backtest/data/. Run it manually (Actions tab or the
# GitHub mobile app). It does not touch docs/, study/ or the watchlists.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date, YYYY-MM-DD"
        required: false
        default: "2014-01-01"
        type: string
      universe:
        description: "Universe file under backtest*/ (default: the tech universe)"
        required: false
        default: "backtest/universe.txt"
        type: string
      out:
        description: "Output folder under backtest*/ (default: backtest/data)"
        required: false
        default: "backtest/data"
        type: string
      tickers:
        description: "Optional comma list; leave empty to use the universe file"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: backtest-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs go through env vars, never interpolated into the script; the Python
      # side validates the date and the tickers.
      - name: Download history
        env:
          START: ${{ inputs.start }}
          TICKERS: ${{ inputs.tickers }}
          UNIVERSE: ${{ inputs.universe }}
          OUT: ${{ inputs.out }}
        run: python scripts/backtest_fetch.py --start "$START" --tickers "$TICKERS" --universe "$UNIVERSE" --out "$OUT"

      - name: Show manifest
        if: always()
        env:
          OUT: ${{ inputs.out }}
        run: cat "$OUT/manifest.csv" || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A backtest backtest2
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update backtest data [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push failed, retrying ($i)..."
            sleep $((i * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
